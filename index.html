<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Китайские истории</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top-banner">Китайские истории</header>

  <!-- ЭКРАН ВХОДА -->
  <section id="login-screen">
    <div class="login-box">
      <h2>Введите никнейм</h2>
      <input type="text" id="nickname-input" placeholder="Ваш никнейм" autocomplete="off" />
      <p id="login-error" class="error-message"></p>
      <button id="login-button">Войти</button>
    </div>
  </section>

  <!-- ЭКРАН ПОЛЬЗОВАТЕЛЯ -->
  <section id="user-screen" class="hidden">
    <div class="main-container">
      <div class="left-column">
        <div class="video-wrapper">
          <video id="video-player" controls autoplay></video>
          <p id="now-playing" class="now-playing">Сейчас ничего не транслируется</p>
        </div>
        <div class="viewers">
          👁 Зрителей онлайн: <span id="viewers-count">0</span>
        </div>
        <div class="schedule">
          <h3>Расписание трансляций</h3>
          <ul id="schedule-list"></ul>
        </div>
      </div>
      <div class="right-column">
        <div class="chat">
          <h3>Чат</h3>
          <div id="chat-messages" class="chat-messages"></div>
          <div class="chat-input-row">
            <input type="text" id="chat-input" placeholder="Написать сообщение..." />
            <button id="chat-send">→</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ЭКРАН АДМИНА -->
  <section id="admin-screen" class="hidden">
    <div class="admin-container">
      <h2>Админ-панель</h2>

      <div class="admin-section">
        <h3>Добавить видео в очередь</h3>
        <input type="text" id="video-title" placeholder="Название видео" />
        <label>Дата и время показа (МСК):</label>
        <input type="datetime-local" id="video-datetime" />
        <label>Ссылка на видеофайл (mp4/webm):</label>
        <input type="text" id="video-url" placeholder="https://..." />
        <p style="font-size:12px;color:#888;margin-bottom:10px;">
          Файл нужно предварительно загрузить на GitHub (см. README) и вставить ссылку.
        </p>
        <button id="add-video-btn">Добавить в очередь</button>
        <p id="admin-status" class="status-message"></p>
      </div>

      <div class="admin-section">
        <h3>Очередь видео</h3>
        <ul id="admin-video-list"></ul>
      </div>

      <div class="admin-section">
        <h3>Модерация чата</h3>
        <div id="admin-chat-messages" class="chat-messages"></div>
      </div>
    </div>
  </section>

  <script type="module" src="script.js"></script>
</body>
</html>
